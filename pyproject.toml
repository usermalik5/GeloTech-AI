[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gelotech-ai"
version = "0.1.0"
description = "A Windows-first desktop AI coding assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4,<5",
    "ruff>=0.9,<1",
]

[project.scripts]
gelotech-ai = "gelotech_ai.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gelotech_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
